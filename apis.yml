name: Surf AI
description: 'Surf AI is an agentic security-operations platform that helps CISOs and modern
  security teams operationalize their entire program with specialized AI agents. It connects
  across identity, cloud, SaaS, and data systems to continuously monitor assets, surface
  exposures, trace issues to their owners, and drive automated remediation so teams can
  shrink the attack surface before it is exploited. The company integrates with 60+ security,
  identity, cloud, SIEM, and business tools, and is backed by Accel, Cyberstarts, and
  Boldstart Ventures. This API Evangelist profile was enriched from public sources; Surf
  AI markets an enterprise platform and does not publish a public developer API surface.'
